# Sobreposição para desenvolvimento local. Não utilize em produção.
services:
  app:
    environment:
      PYTHONPATH: /app/src
      APP_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./backups:/app/backups
    command:
      - uv
      - run
      - uvicorn
      - flow_crm.main:app
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --reload
      - --reload-dir
      - /app/src

  db:
    ports:
      - "5433:5432"

networks:
  web_network:
    external: false
