# Sobreposição automática de desenvolvimento para Docker Compose.
services:
  app:
    environment:
      PYTHONPATH: /app/src
      APP_ENV: development
    ports:
      - "8005:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    command:
      - uv
      - run
      - uvicorn
      - flow_crm.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    networks:
      - dev_db_network

networks:
  web_network:
    external: false
  postgres_network:
    external: false
  dev_db_network:
    external: true
