<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowCRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css?v=4"></head>
<body>
    <aside>
    <div class="brand"><i>F</i><span>FlowCRM<small>OPERATIONS SUITE</small></span></div>
    <nav id="nav"></nav>
    <div class="workspace"><b id="user-initials">--</b><span id="current-user">Carregando…<small id="current-role">Sessão</small></span></div>
</aside>
<div class="shell">
    <header><input id="search" placeholder="Pesquisar registros…" autocomplete="off">
    <div class="header-actions">
        <button class="secondary" id="logout">Sair</button>
        <button id="new">+ Novo</button>
    </div>
</header>
<main><div id="view"></div></main></div><dialog id="modal"><form id="form" method="dialog"><div class="modal-head"><h2 id="form-title">Novo registro</h2><button type="button" class="icon" id="close">×</button></div><div id="fields"></div><p id="error"></p><div class="actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button>Salvar</button></div></form></dialog>

<dialog id="key-modal">
    <div class="modal-head">
        <h2>🔑 Chave de API Gerada</h2>
        <button type="button" class="icon" id="close-key-modal">×</button>
    </div>
    <div style="padding: 20px; display: grid; gap: 14px;">
        <p style="color: var(--muted); font-size: 13px; margin: 0;">
            Copie a chave abaixo agora. Por motivos de segurança, ela <strong>não poderá ser visualizada novamente</strong>.
        </p>
        <div style="display: flex; gap: 8px;">
            <input id="generated-key-input" type="text" readonly style="font-family: monospace; font-size: 13px; font-weight: 600; background: #f8fafc; border: 1px solid #cbd5e1;">
            <button type="button" id="copy-key-btn" style="white-space: nowrap;">Copiar</button>
        </div>
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; font-size: 12px; color: #1e40af;">
            <strong>Como usar:</strong> Envie no cabeçalho HTTP <code>X-API-Key: fc_live_...</code> ou conecte seu cliente MCP em <code>http://localhost:8000/mcp/sse</code>.
        </div>
    </div>
    <div class="actions">
        <button type="button" id="done-key-btn">Concluído</button>
    </div>
</dialog>

<script src="/app.js?v=4"></script></body></html>
